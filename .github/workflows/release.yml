# Tag push: test → build → GitHub Release → https://gluestick.sh/releases/shim/
# Manual: workflow_dispatch with an existing tag to re-sync that release to the site.
#
# Secrets (org recommended): GLUESTICK_SSH_HOST, GLUESTICK_SSH_PORT,
#   GLUESTICK_SSH_USER, GLUESTICK_SSH_KEY, GLUESTICK_SSH_PATH,
#   optional GLUESTICK_SSH_PASSPHRASE / GLUESTICK_SSH_KNOWN_HOSTS
# Upload target: $GLUESTICK_SSH_PATH/shim/ → https://gluestick.sh/releases/shim/

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to sync to gluestick.sh (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    if: github.event_name == 'push'
    name: test + smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build and smoke (amd64)
        shell: pwsh
        run: |
          go build -o shim.exe .
          if (-not (Test-Path shim.exe)) { throw "shim.exe not found" }

  build:
    if: github.event_name == 'push'
    name: build shim-${{ matrix.goarch }}.exe
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build shim.exe
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="shim-windows-${{ matrix.goarch }}.exe"
          go build -trimpath -ldflags "-s -w" -o "$out" .
          sha256sum "$out" | awk '{print $1}' > "$out.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: shim-windows-${{ matrix.goarch }}
          path: |
            shim-windows-${{ matrix.goarch }}.exe
            shim-windows-${{ matrix.goarch }}.exe.sha256

  release:
    if: github.event_name == 'push'
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: shim-windows-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v7
        with:
          name: shim-release
          path: |
            dist/shim-windows-amd64.exe
            dist/shim-windows-arm64.exe
            dist/shim-windows-amd64.exe.sha256
            dist/shim-windows-arm64.exe.sha256
          if-no-files-found: error

  sync-web:
    if: github.event_name == 'workflow_dispatch'
    name: sync from existing release
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" -R "${{ github.repository }}" -D dist \
            -p 'shim-windows-amd64.exe' \
            -p 'shim-windows-arm64.exe' \
            -p 'shim-windows-amd64.exe.sha256' \
            -p 'shim-windows-arm64.exe.sha256'
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: shim-release
          path: |
            dist/shim-windows-amd64.exe
            dist/shim-windows-arm64.exe
            dist/shim-windows-amd64.exe.sha256
            dist/shim-windows-arm64.exe.sha256
          if-no-files-found: error

  publish-web:
    name: publish to gluestick.sh
    runs-on: ubuntu-latest
    needs: [release, sync-web]
    if: |
      always() && !cancelled() && (
        needs.release.result == 'success' ||
        needs.sync-web.result == 'success'
      )
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shim-release
          path: dist

      - name: Upload to gluestick.sh/releases/shim/
        env:
          SSH_HOST: ${{ secrets.GLUESTICK_SSH_HOST }}
          SSH_PORT: ${{ secrets.GLUESTICK_SSH_PORT }}
          SSH_USER: ${{ secrets.GLUESTICK_SSH_USER }}
          SSH_KEY: ${{ secrets.GLUESTICK_SSH_KEY }}
          SSH_PATH: ${{ secrets.GLUESTICK_SSH_PATH }}
          SSH_PASSPHRASE: ${{ secrets.GLUESTICK_SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.GLUESTICK_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          port="${SSH_PORT}"
          root="${SSH_PATH%/}"
          remote_dir="${root}/shim"

          # Safe diagnostics (never print key / passphrase contents).
          echo "::group::SSH config diagnostics"
          echo "SSH_HOST set: $([ -n "${SSH_HOST:-}" ] && echo yes || echo NO)"
          echo "SSH_PORT: ${port:-<empty>}"
          echo "SSH_USER set: $([ -n "${SSH_USER:-}" ] && echo yes || echo NO)"
          echo "SSH_PATH set: $([ -n "${SSH_PATH:-}" ] && echo yes || echo NO)"
          echo "remote_dir ends with: /shim"
          echo "SSH_KEY set: $([ -n "${SSH_KEY:-}" ] && echo yes || echo NO)"
          echo "SSH_KEY lines: $(printf '%s\n' "${SSH_KEY:-}" | wc -l)"
          echo "SSH_KEY begins with: $(printf '%s\n' "${SSH_KEY:-}" | head -n1 | tr -d '\r')"
          echo "SSH_PASSPHRASE set: $([ -n "${SSH_PASSPHRASE:-}" ] && echo yes || echo NO)"
          echo "SSH_KNOWN_HOSTS set: $([ -n "${SSH_KNOWN_HOSTS:-}" ] && echo yes || echo NO)"
          echo "::endgroup::"

          mkdir -p stage
          for name in \
            shim-windows-amd64.exe \
            shim-windows-arm64.exe \
            shim-windows-amd64.exe.sha256 \
            shim-windows-arm64.exe.sha256
          do
            src="dist/${name}"
            if [ ! -f "$src" ]; then
              echo "missing file: $src"
              find dist -type f | head -n 50
              exit 1
            fi
            cp -f "$src" "stage/${name}"
            echo "staged ${name}"
          done
          ls -la stage

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! head -n1 ~/.ssh/deploy_key | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "::error::GLUESTICK_SSH_KEY does not look like a PEM private key (first line should be BEGIN … PRIVATE KEY)"
            head -n1 ~/.ssh/deploy_key
            exit 1
          fi

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "using GLUESTICK_SSH_KNOWN_HOSTS"
          else
            echo "GLUESTICK_SSH_KNOWN_HOSTS empty; running ssh-keyscan"
            if ! ssh-keyscan -p "$port" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>~/ssh-keyscan.err; then
              echo "::error::ssh-keyscan failed"
              cat ~/ssh-keyscan.err || true
              exit 1
            fi
            cat ~/ssh-keyscan.err || true
          fi
          chmod 644 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            export SSH_PASSPHRASE
            printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SSH_PASSPHRASE"' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
              ssh-add ~/.ssh/deploy_key </dev/null
          else
            ssh-add ~/.ssh/deploy_key
          fi

          echo "::group::Loaded deploy key"
          ssh-add -l
          echo "public key (must appear in server ~/.ssh/authorized_keys for SSH_USER):"
          ssh-add -L
          echo "::endgroup::"

          ssh_base=(ssh -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o PreferredAuthentications=publickey)

          echo "::group::SSH connection probe (verbose)"
          set +e
          "${ssh_base[@]}" -vvv "${SSH_USER}@${SSH_HOST}" "echo ok" 2>~/ssh-probe.err
          probe_rc=$?
          set -e
          grep -E 'Authentications|Offering|Server accepts|Authentication succeeded|Permission denied|Connection|identity file|Ready to authenticate|publickey' ~/ssh-probe.err || true
          echo "---- full verbose log ----"
          cat ~/ssh-probe.err
          echo "::endgroup::"

          if [ "$probe_rc" -ne 0 ]; then
            echo "::error::SSH auth failed (exit ${probe_rc}). Server rejected the deploy key for this user/host, or wrong key/user/host/port. Compare the printed public key with authorized_keys on the server."
            exit "$probe_rc"
          fi

          echo "mkdir …/shim"
          "${ssh_base[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p $(printf %q "$remote_dir")"

          echo "rsync -> …/shim/"
          echo "public URL: https://gluestick.sh/releases/shim/"
          rsync -avz --chmod=Fu=rw,Fgo=r,Du=rwx,Dgo=rx \
            -e "ssh -p ${port} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            stage/ "${SSH_USER}@${SSH_HOST}:${remote_dir}/"
